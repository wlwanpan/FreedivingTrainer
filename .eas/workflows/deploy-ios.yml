name: Deploy to Production (iOS)

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    type: build
    environment: production
    params:
      platform: ios
      profile: production
  submit_ios:
    needs: [build_ios]
    type: submit
    environment: production
    env:
      EXPO_DEBUG: "1"
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
