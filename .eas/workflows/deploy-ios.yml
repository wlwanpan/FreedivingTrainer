name: Deploy to Production (iOS)

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    type: build
    environment: production
    params:
      platform: ios
      profile: production
  submit_ios:
    needs: [build_ios]
    type: submit
    environment: production
    env:
      EXPO_DEBUG: "1"
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
    hooks:
      after_checkout:
        - name: Apply App Store Connect app id
          run: |
            node <<'EOF'
            const fs = require('fs')

            const easPath = 'eas.json'
            const eas = JSON.parse(fs.readFileSync(easPath, 'utf8'))
            eas.submit = eas.submit || {}
            eas.submit.production = eas.submit.production || {}
            eas.submit.production.ios = eas.submit.production.ios || {}

            const ios = eas.submit.production.ios
            const fromEnv = process.env.ASC_APP_ID
            if (fromEnv) {
              if (!/^\d+$/.test(fromEnv)) {
                console.error('ASC_APP_ID must be the numeric App Store Connect Apple ID.')
                process.exit(1)
              }
              ios.ascAppId = fromEnv
              fs.writeFileSync(easPath, `${JSON.stringify(eas, null, 2)}\n`)
              process.exit(0)
            }

            if (!ios.ascAppId) {
              console.error(
                'Non-interactive EAS Submit needs the App Store Connect Apple ID. Set ascAppId on submit.production.ios in eas.json, or set the production EAS environment variable ASC_APP_ID.'
              )
              process.exit(1)
            }
            EOF
